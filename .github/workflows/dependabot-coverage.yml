name: Dependabot coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install YAML parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Test coverage checker
        run: python3 -m unittest discover -s scripts -p 'test_dependabot_coverage.py'
      - name: Check dependency ecosystem coverage
        run: python3 scripts/check_dependabot_coverage.py
